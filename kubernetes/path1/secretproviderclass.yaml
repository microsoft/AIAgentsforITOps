apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-keyvault-secrets
  namespace: agent-demo
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "${AKS_IDENTITY_CLIENT_ID}"
    keyvaultName: "${KEY_VAULT_NAME}"
    cloudName: ""
    objects: |
      array:
        - |
          objectName: AKS-ManagedIdentity-ClientId
          objectType: secret
          objectVersion: ""
        - |
          objectName: AzureOpenAI-Endpoint
          objectType: secret
          objectVersion: ""
        - |
          objectName: ApplicationInsights-ConnectionString
          objectType: secret
          objectVersion: ""
        - |
          objectName: AzureSearch-Endpoint
          objectType: secret
          objectVersion: ""
    tenantId: "${AZURE_TENANT_ID}"
  # Note: No secretObjects section - secrets are only mounted as files
  # This is more secure as secrets never exist as Kubernetes secrets
