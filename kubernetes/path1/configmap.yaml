apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-webapp-config
  namespace: agent-demo
data:
  # Note: Secrets are managed via Azure Key Vault CSI Driver
  # Sensitive values like endpoints are mounted as files from Key Vault
  azure-search-name: "${AZURE_SEARCH_NAME}"
  foundry-model-deployment: "gpt-5.4-mini"
  agent-mode: "custom"
